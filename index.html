<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Your Dream - Character Profile</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(180deg, #fde4f2 0%, #f7bade 35%, #e3bdff 70%, #fce4ec 100%);
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-shadow: 0 8px 32px 0 rgba(235, 120, 180, 0.25);
            --text-color: #ffffff;
            --accent-pink: #ff69b4;
            --accent-purple: #9b51e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Noto Sans KR', 'Cormorant Garamond', serif;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
        }

        /* 모바일 프레임 */
        .mobile-frame {
            width: 100%;
            max-width: 430px;
            height: 932px;
            background: var(--bg-gradient);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
        }

        /* 화면 전환 */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.5s ease;
            transform: scale(0.96);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* 헤더 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            stroke: #fff;
            fill: none;
            stroke-width: 1.8;
        }

        /* ===== 1. 메인 화면 ===== */
        .start-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -20px;
        }

        .arch-portal {
            width: 110px;
            height: 160px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 60px 60px 0 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.3) 0%, rgba(247, 186, 222, 0.1) 100%);
        }

        .arch-portal::before {
            content: '🌙';
            font-size: 28px;
            filter: drop-shadow(0 0 8px #fff);
        }

        .main-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 46px;
            font-style: italic;
            font-weight: 600;
            line-height: 1.1;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(214, 80, 150, 0.4);
        }

        .orbital-ring {
            position: relative;
            display: inline-block;
        }

        .orbital-ring::after {
            content: '';
            position: absolute;
            top: -10%;
            left: -15%;
            width: 130%;
            height: 120%;
            border: 1.5px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            transform: rotate(-12deg);
            pointer-events: none;
        }

        .sub-title {
            margin-top: 15px;
            font-size: 14px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .start-btn {
            margin-top: 45px;
            width: 260px;
            height: 60px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(255, 182, 218, 0.6) 0%, rgba(255, 126, 187, 0.8) 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            color: #fff;
            font-size: 20px;
            letter-spacing: 4px;
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            animation: pulse 2s infinite alternate;
        }

        .start-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 30px rgba(255, 105, 180, 0.6), inset 0 0 15px rgba(255, 255, 255, 0.8);
        }

        @keyframes pulse {
            0% { box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3); }
            100% { box-shadow: 0 12px 30px rgba(255, 105, 180, 0.7), 0 0 15px rgba(255, 255, 255, 0.8); }
        }

        .bottom-settings {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            opacity: 0.8;
            font-size: 13px;
        }

        /* ===== 2. 테마 선택 화면 ===== */
        .theme-title-box {
            text-align: center;
            margin-top: 10px;
        }

        .theme-main-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            letter-spacing: 3px;
            font-weight: 600;
            text-shadow: 0 2px 8px rgba(214, 80, 150, 0.3);
        }

        .theme-sub-title {
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 4px;
            color: rgba(255, 255, 255, 0.9);
        }

        .center-gem {
            width: 36px;
            height: 36px;
            margin: 12px auto;
            background: linear-gradient(135deg, #ffffff 0%, #ff9ebb 50%, #e066ff 100%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            animation: floatGem 3s ease-in-out infinite alternate;
        }

        @keyframes floatGem {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-6px) rotate(5deg); }
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-height: 560px;
            overflow-y: auto;
            padding: 5px 4px 15px 4px;
        }

        .cards-grid::-webkit-scrollbar {
            display: none;
        }

        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            backdrop-filter: blur(12px);
            box-shadow: var(--glass-shadow);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(255, 255, 255, 0.4);
            border-color: #ffffff;
            box-shadow: 0 10px 25px rgba(255, 126, 187, 0.4);
        }

        .card-icon {
            font-size: 28px;
        }

        .card-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .theme-footer {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.85);
        }

        /* ===== 3. 프로필 팝업 모달 (NEW) ===== */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(40, 10, 30, 0.5);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 100%;
            max-width: 350px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 210, 235, 0.35) 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 15px 35px rgba(214, 80, 150, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(20px);
            position: relative;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        /* 닫기 버튼 */
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: rotate(90deg);
        }

        /* 인물 이미지 커스텀 */
        .profile-img-container {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 20px rgba(235, 120, 180, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.5);
            overflow: hidden;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 16px;
            text-shadow: 0 2px 6px rgba(214, 80, 150, 0.3);
            color: #ffffff;
        }

        /* 프로필 상세 정보 목록 */
        .info-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 14px;
            padding: 10px 14px;
            backdrop-filter: blur(8px);
        }

        .info-label {
            font-size: 11px;
            font-weight: 700;
            color: #ff3e9e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-value {
            font-size: 13px;
            color: #4a2a3b;
            line-height: 1.4;
            font-weight: 500;
        }
    </style>
</head>

                job: '수녀',
                personality: '신앙심, 차분함, 절제, 소유욕',
                preference: '미스트레스, 마미, 마조히스트, 과도한 쾌락 선호'
            }
        };

        // DOM 요소
        const startScreen = document.getElementById('startScreen');
        const themeScreen = document.getElementById('themeScreen');
        const startBtn = document.getElementById('startBtn');
        const backBtn = document.getElementById('backBtn');
        const homeBtn = document.getElementById('homeBtn');

        const profileModal = document.getElementById('profileModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        const modalImg = document.getElementById('modalImg');
        const modalTitle = document.getElementById('modalTitle');
        const modalJob = document.getElementById('modalJob');
        const modalPersonality = document.getElementById('modalPersonality');
        const modalPreference = document.getElementById('modalPreference');

        // 메인 화면 전환
        startBtn.addEventListener('click', () => {
            startScreen.classList.remove('active');
            themeScreen.classList.add('active');
        });

        const goToStart = () => {
            closeProfile();
            themeScreen.classList.remove('active');
            startScreen.classList.add('active');
        };

        backBtn.addEventListener('click', goToStart);
        homeBtn.addEventListener('click', goToStart);

        // 2. 프로필 팝업 열기
        function openProfile(key) {
            const data = characterData[key];
            if (data) {
                modalImg.src = data.img;
                modalTitle.textContent = data.name;
                modalJob.textContent = data.job;
                modalPersonality.textContent = data.personality;
                modalPreference.textContent = data.preference;

                profileModal.classList.add('active');
            }
        }

        // 3. 프로필 팝업 닫기
        function closeProfile() {
            profileModal.classList.remove('active');
        }

        modalCloseBtn.addEventListener('click', closeProfile);
        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) {
                closeProfile();
            }
        });
    </script>
</body>
</html>
